[package]
name = "news_platform_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
tera = "1.19"
tower-http = { version = "0.5", features = ["fs"] }
uuid = { version = "1.6", features = ["v4"] }